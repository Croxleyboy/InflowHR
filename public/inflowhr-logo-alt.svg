<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <!-- Circle with figure -->
  <g transform="translate(55, 60)">
    <!-- Outer circle (filled ring) -->
    <circle cx="0" cy="0" r="52" fill="#e91e8a"/>
    <circle cx="0" cy="0" r="44" fill="#1a1030"/>
    <!-- Figure head -->
    <circle cx="0" cy="-20" r="7" fill="#e91e8a"/>
    <!-- Figure body -->
    <rect x="-2.5" y="-12" width="5" height="26" rx="2.5" fill="#e91e8a"/>
    <!-- Figure arms (raised, thick) -->
    <path d="M-2 -6 Q-10 -18 -20 -26" stroke="#e91e8a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M2 -6 Q10 -18 20 -26" stroke="#e91e8a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Figure legs -->
    <path d="M-1 14 Q-6 24 -14 34" stroke="#e91e8a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M1 14 Q6 24 14 34" stroke="#e91e8a" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- InflowHR text -->
  <text x="124" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Inflow<tspan font-weight="800">HR</tspan></text>
  <!-- BUILT BY MOVE2MODERN subtitle -->
  <text x="126" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="3.5">BUILT BY MOVE2MODERN</text>
</svg>
