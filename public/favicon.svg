  <path d="M24 21.8l.8 2.2-.8.8-.8-.8z M24 26.2l-.8-2.2.8-.8.8.8z M21.8 24l2.2-.8.8.8-.8.8z M26.2 24l-2.2.8-.8-.8.8-.8z" fill="#b9c7d7"/>
  <!-- Teal person (top) -->
