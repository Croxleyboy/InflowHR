<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e64dc"/><stop offset="100%" stop-color="#14aa64"/></linearGradient>
    <linearGradient id="br" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#14aa64"/><stop offset="100%" stop-color="#ffa51e"/></linearGradient>
    <linearGradient id="bb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffa51e"/><stop offset="100%" stop-color="#8c28c8"/></linearGradient>
    <linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8c28c8"/><stop offset="100%" stop-color="#1e64dc"/></linearGradient>
  </defs>
  <!-- Rainbow border -->
